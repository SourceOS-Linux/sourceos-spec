name: SourceLocator

on:
  pull_request:
    paths:
      - 'schemas/SourceLocator.json'
      - 'tools/validate_source_locator.py'
      - '.github/workflows/source-locator.yml'
  push:
    branches:
      - main
    paths:
      - 'schemas/SourceLocator.json'
      - 'tools/validate_source_locator.py'
      - '.github/workflows/source-locator.yml'

permissions:
  contents: read

jobs:
  validate-source-locator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate SourceLocator schema
        run: |
          python3 -m pip install jsonschema
          python3 tools/validate_source_locator.py
