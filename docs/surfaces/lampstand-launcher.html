<title>lampstand — the semantic launcher</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#e8ebf2; --wall1:#c8b6d6; --wall2:#f0c9c0;
  --card:#ffffff; --card2:#f6f8fb; --line:#e5e9f1; --line2:#d6dced;
  --ink:#1c2333; --muted:#5c6884; --faint:#8a93a8;
  --accent:#3b6ef5; --accent-bg:#eaf0ff;
  /* semantic layer colors — match the annotation legend */
  --intent:#7cc47f; --intent-bg:#e5f4e4;
  --type:#6bb7d6; --type-bg:#e2f1f7;
  --relation:#8b9fc4; --relation-bg:#e9edf6;
  --entity:#eba06a; --entity-bg:#fbeade;
  --scope:#b79ad6; --scope-bg:#f0e9f8;
  --ok:#2f9e63; --warn:#d98a2b; --deny:#d9534f;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace; --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1220; --wall1:#2a2340; --wall2:#3a2530;
  --card:#161c2b; --card2:#1c2434; --line:#26304a; --line2:#313d5c;
  --ink:#e8edf7; --muted:#9aa5bd; --faint:#6b7591; --accent:#5b86ff; --accent-bg:#1a2banarchy;
  --accent-bg:#182545;
  --intent:#5aa85f; --intent-bg:#16301a; --type:#4d97b8; --type-bg:#122a33; --relation:#6b7fac; --relation-bg:#1a2236;
  --entity:#cf8552; --entity-bg:#2e2013; --scope:#9878c0; --scope-bg:#231a33; --ok:#43c68a; --warn:#e0a83a; --deny:#e5594f;
}}
:root[data-theme="light"]{--bg:#e8ebf2;--card:#fff;--card2:#f6f8fb;--line:#e5e9f1;--line2:#d6dced;--ink:#1c2333;--muted:#5c6884;--faint:#8a93a8;--accent:#3b6ef5;--accent-bg:#eaf0ff;--intent:#7cc47f;--intent-bg:#e5f4e4;--type:#6bb7d6;--type-bg:#e2f1f7;--relation:#8b9fc4;--relation-bg:#e9edf6;--entity:#eba06a;--entity-bg:#fbeade;--scope:#b79ad6;--scope-bg:#f0e9f8;--ok:#2f9e63;--warn:#d98a2b;--deny:#d9534f}
:root[data-theme="dark"]{--bg:#0e1220;--card:#161c2b;--card2:#1c2434;--line:#26304a;--line2:#313d5c;--ink:#e8edf7;--muted:#9aa5bd;--faint:#6b7591;--accent:#5b86ff;--accent-bg:#182545;--intent:#5aa85f;--intent-bg:#16301a;--type:#4d97b8;--type-bg:#122a33;--relation:#6b7fac;--relation-bg:#1a2236;--entity:#cf8552;--entity-bg:#2e2013;--scope:#9878c0;--scope-bg:#231a33;--ok:#43c68a;--warn:#e0a83a;--deny:#e5594f}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:var(--sans);color:var(--ink);
  background:
    radial-gradient(120% 80% at 20% 0%, var(--wall1) 0%, transparent 55%),
    radial-gradient(120% 90% at 90% 20%, var(--wall2) 0%, transparent 50%),
    var(--bg);
  padding:38px 18px 60px;-webkit-font-smoothing:antialiased}
.shell{max-width:660px;margin:0 auto}
.brand{display:flex;align-items:center;gap:9px;justify-content:center;margin-bottom:14px;color:var(--ink)}
.brand .mk{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--accent),var(--scope));display:grid;place-items:center;color:#fff;font-size:13px}
.brand b{font-size:15px;letter-spacing:.3px}.brand span{color:var(--muted);font-size:12.5px}
.tgl{background:none;border:1px solid var(--line2);border-radius:7px;width:30px;height:30px;color:var(--muted);cursor:pointer;margin-left:6px}
.launcher{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 60px -20px rgba(20,28,60,.45),0 2px 6px rgba(20,28,60,.1);overflow:hidden}
.qbar{display:flex;align-items:center;gap:12px;padding:17px 20px;border-bottom:1px solid var(--line)}
.qbar .mag{color:var(--faint);font-size:18px}
.qbar input{flex:1;border:none;background:none;outline:none;font:inherit;font-size:19px;color:var(--ink);letter-spacing:.1px}
.qbar input::placeholder{color:var(--faint)}
.qbar .cnt{font-family:var(--mono);font-size:10.5px;color:var(--faint);border:1px solid var(--line2);border-radius:5px;padding:2px 6px}
.exs{display:flex;flex-wrap:wrap;gap:7px;padding:12px 20px;background:var(--card2);border-bottom:1px solid var(--line)}
.exs .l{font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--faint);align-self:center;margin-right:2px}
.ex{font-size:12px;border:1px solid var(--line2);background:var(--card);border-radius:16px;padding:5px 12px;cursor:pointer;color:var(--muted)}
.ex.on{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
/* understanding */
.sec{padding:14px 20px;border-bottom:1px solid var(--line)}
.sec h3{font-size:10.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--faint);margin:0 0 11px;font-weight:700}
.tok{display:grid;grid-template-columns:118px 130px 1fr;gap:10px;align-items:center;padding:4px 0;font-size:13px}
.tok .w{font-weight:600}.tok .w small{color:var(--faint);font-weight:400;font-family:var(--mono);font-size:10px}
.tok .g{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.tok .ann{display:flex;flex-wrap:wrap;gap:5px}
.a{font-family:var(--mono);font-size:10.5px;padding:2px 8px;border-radius:5px;white-space:nowrap}
.a.intent{background:var(--intent-bg);color:var(--intent)} .a.type{background:var(--type-bg);color:var(--type)}
.a.relation{background:var(--relation-bg);color:var(--relation)} .a.entity{background:var(--entity-bg);color:var(--entity)}
.a.scope{background:var(--scope-bg);color:var(--scope)}
/* resolved intent line */
.resolved{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:13px 20px;background:var(--card2);border-bottom:1px solid var(--line);font-size:13px}
.resolved .lab{font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--faint)}
.resolved .frag{font-family:var(--mono);font-size:12px}
.pill{font-family:var(--mono);font-size:10.5px;padding:3px 9px;border-radius:14px;border:1px solid var(--line2)}
.pill.purpose{background:var(--accent-bg);color:var(--accent);border-color:transparent}
.pill.ok{background:var(--intent-bg);color:var(--ok);border-color:transparent}
.pill.ask{background:var(--scope-bg);color:var(--warn);border-color:transparent}
.pill.deny{background:var(--entity-bg);color:var(--deny);border-color:transparent}
/* results */
.res{padding:8px 12px}
.row{display:flex;align-items:center;gap:13px;padding:11px 12px;border-radius:11px;cursor:default}
.row+.row{margin-top:2px}
.row:hover{background:var(--card2)}
.row.sel{background:var(--accent-bg)}
.row .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:18px;flex:none;background:var(--card2);border:1px solid var(--line)}
.row .body{flex:1;min-width:0}
.row .ti{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.row .sub{font-size:12px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub .mono{font-family:var(--mono);font-size:11px}
.act{font-size:12px;font-weight:600;border-radius:8px;padding:7px 14px;border:1px solid var(--line2);background:var(--card);cursor:pointer;flex:none}
.act.run{background:var(--accent);border-color:var(--accent);color:#fff}
.act.ask{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.act.deny{color:var(--deny);border-color:color-mix(in srgb,var(--deny) 40%,transparent)}
.route{display:flex;align-items:center;gap:8px;padding:11px 20px;font-size:11.5px;color:var(--faint);font-family:var(--mono);border-top:1px solid var(--line);background:var(--card2)}
.route b{color:var(--muted);font-weight:600}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
.toast .mono{font-family:var(--mono);font-size:11px;opacity:.8}
.footnote{text-align:center;color:var(--faint);font-size:11.5px;margin-top:16px;line-height:1.6}
</style>

<div class="shell">
  <div class="brand"><span class="mk">✦</span><b>lampstand</b><span>· the semantic launcher</span>
    <button class="tgl" id="tgl" aria-label="Toggle theme">◑</button></div>

  <div class="launcher">
    <div class="qbar"><span class="mag">⌕</span>
      <input id="q" value="show me all contact lists in my org" aria-label="Ask lampstand" spellcheck="false"/>
      <span class="cnt">↵ run</span></div>

    <div class="exs"><span class="l">try</span>
      <button class="ex on" data-i="0">show me all contact lists in my org</button>
      <button class="ex" data-i="1">open terminal on my laptop</button>
      <button class="ex" data-i="2">delete last week's logs</button>
    </div>

    <div class="sec"><h3>Understanding — tokens · pos/dep · semantics</h3><div id="tokens"></div></div>
    <div class="resolved" id="resolved"></div>
    <div class="res" id="results"></div>
    <div class="route" id="route"></div>
  </div>

  <p class="footnote">Every result is a <b>typed act</b>, not a web search — parsed by the App-Intents ontology, ranked by <span style="font-family:var(--mono)">sherlock</span> (IR), and admitted by the consent plane. Nothing runs un-consented; nothing runs un-receipted.</p>
</div>
<div class="toast" id="toast"></div>

<script>
const Q=[
{ q:"show me all contact lists in my org",
  tokens:[
   {w:"show",p:"VB · ROOT",ann:[["ActionShow","intent"]]},
   {w:"me",p:"PRP · iobj",ann:[["ActionShow","intent"]]},
   {w:"all",p:"DT · det",ann:[]},
   {w:"contact",p:"NN · nn",ann:[["ContactLists","intent"]]},
   {w:"lists",p:"NNS · dobj",ann:[["ContactLists","intent"],["Lists","type"]]},
   {w:"in",p:"IN · prep",ann:[["Contains","relation"],["Relation","relation"]]},
   {w:"my",p:"PRP$ · poss",ann:[["Own","scope"]]},
   {w:"org",p:"NN · pobj",ann:[["Organization","entity"]]},
  ],
  intent:"ActionShow", obj:":ContactLists", scope:"scope :Own ∩ :Organization",
  purpose:"discover", decision:"ok", dlabel:"admitted",
  route:["lampstand","sherlock (IR)","holmes"],
  results:[
   {ic:"👥",ti:"Sales — Contact List",sub:"142 contacts · <span class='mono'>:ContactLists</span> · owner you · org SocioProphet",act:"Show",cls:"run"},
   {ic:"👥",ti:"Investors — Contact List",sub:"38 contacts · <span class='mono'>:ContactLists</span> · shared · org SocioProphet",act:"Show",cls:"run"},
   {ic:"👥",ti:"Partners — Contact List",sub:"57 contacts · <span class='mono'>:ContactLists</span> · owner you · org SocioProphet",act:"Show",cls:"run"},
  ]},
{ q:"open terminal on my laptop",
  tokens:[
   {w:"open",p:"VB · ROOT",ann:[["ActionLaunch","intent"]]},
   {w:"terminal",p:"NN · dobj",ann:[["TurtleTerm","intent"],["App","type"]]},
   {w:"on",p:"IN · prep",ann:[["OnDevice","relation"]]},
   {w:"my",p:"PRP$ · poss",ann:[["Own","scope"]]},
   {w:"laptop",p:"NN · pobj",ann:[["Device","entity"]]},
  ],
  intent:"ActionLaunch", obj:":TurtleTerm", scope:"on :Own :Device(laptop) · user-space",
  purpose:"operate", decision:"ask", dlabel:"consent required",
  route:["lampstand","app-intents","consent-plane"],
  results:[
   {ic:"▚",ti:"Launch TurtleTerm",sub:"user-space · <span class='mono'>purpose=operate</span> · this device · agent may co-drive with consent",act:"Consent",cls:"ask"},
  ]},
{ q:"delete last week's logs",
  tokens:[
   {w:"delete",p:"VB · ROOT",ann:[["ActionDelete","intent"],["Destructive","type"]]},
   {w:"last",p:"JJ · amod",ann:[["TimeWindow","scope"]]},
   {w:"week's",p:"NN · poss",ann:[["TimeWindow","scope"]]},
   {w:"logs",p:"NNS · dobj",ann:[["LogData","entity"],["Data","type"]]},
  ],
  intent:"ActionDelete", obj:":LogData", scope:"window :LastWeek · system-space",
  purpose:"operate · destructive", decision:"deny", dlabel:"→ Governor (high)",
  route:["lampstand","guardrail-fabric","Governor queue"],
  results:[
   {ic:"⚠",ti:"Delete LogData (last week)",sub:"system-space · <span class='mono'>purpose=operate</span> · irreversible · <span class='mono'>ESCALATE tier=high</span>",act:"Escalate",cls:"deny"},
  ]},
];
const el=id=>document.getElementById(id);let cur=0;
function render(i){cur=i;const d=Q[i];
  el('q').value=d.q;
  document.querySelectorAll('.ex').forEach(e=>e.classList.toggle('on',+e.dataset.i===i));
  el('tokens').innerHTML=d.tokens.map(t=>`<div class="tok">
    <span class="w">${t.w}</span><span class="g">${t.p}</span>
    <span class="ann">${t.ann.map(a=>`<span class="a ${a[1]}">:${a[0]}</span>`).join('')}</span></div>`).join('');
  const pc={ok:'ok',ask:'ask',deny:'deny'}[d.decision];
  el('resolved').innerHTML=`<span class="lab">resolved</span>
    <span class="frag"><b style="color:var(--intent)">:${d.intent}</b> ${d.obj}</span>
    <span class="frag" style="color:var(--muted)">${d.scope}</span>
    <span class="pill purpose">purpose=${d.purpose}</span>
    <span class="pill ${pc}">${d.dlabel}</span>`;
  el('results').innerHTML=d.results.map((r,ri)=>`<div class="row ${ri===0?'sel':''}">
    <span class="ic">${r.ic}</span>
    <div class="body"><div class="ti">${r.ti}</div><div class="sub">${r.sub}</div></div>
    <button class="act ${r.cls}" onclick="fire(${i},${ri})">${r.act}</button></div>`).join('');
  el('route').innerHTML=`<b>route</b> ${d.route.join(' &nbsp;→&nbsp; ')} <span style="margin-left:auto">sealed on run · sha256</span>`;
}
function fire(i,ri){const d=Q[i],r=d.results[ri];
  let msg,seal='sha256:'+Math.random().toString(16).slice(2,10)+'…';
  if(r.cls==='run') msg=`✓ ${r.ti} — shown · receipted <span class="mono">${seal}</span>`;
  else if(r.cls==='ask') msg=`◑ Consent prompt raised — awaiting your grant <span class="mono">purpose=operate</span>`;
  else msg=`⛔ Refused — sent to Governor for approval <span class="mono">tier=high</span>`;
  const t=el('toast');t.innerHTML=msg;t.classList.add('show');clearTimeout(window._t);window._t=setTimeout(()=>t.classList.remove('show'),2600);}
document.querySelectorAll('.ex').forEach(e=>e.onclick=()=>render(+e.dataset.i));
el('q').addEventListener('keydown',e=>{if(e.key==='Enter')fire(cur,0);});
el('tgl').onclick=()=>{const r=document.documentElement;const c=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');r.setAttribute('data-theme',c==='dark'?'light':'dark');};
render(0);
</script>
